[project]
name = "harness-qwen"
version = "0.1.0"
description = "A hardware-aware local agent harness for Qwen3.6-35B-A3B"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alexander Schneider" }]
keywords = ["llm", "agent", "llama.cpp", "local-inference", "qwen"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "local_llm: requires the real local model to be loaded and served (deselect with -m 'not local_llm')",
    "slow: takes more than a few seconds",
    "sandbox: needs a usable bubblewrap on the host; skipped where it is not",
]
# -ra prints why anything was skipped: a capability test that quietly vanished
# on a runner looks exactly like a passing one otherwise.
addopts = "-m 'not local_llm' --strict-markers -ra"

# Coverage floors enforced by scripts/coverage_gate.py. Per package, because a
# single number for the tree either lets the agent loop rot or blocks work over
# the llama.cpp client. Set just below the measured baseline on 2026-08-20 —
# high enough to catch a regression, not so high that the gate ships red.
[tool.coverage_gate]
total = 66.0

[tool.coverage_gate.modules]
agent = 88.0       # measured 90.9
benchmark = 93.0   # measured 96.1 — new, exercised end to end against
                   # FakeProvider and stubbed port probes. High on purpose:
                   # this is the module every measured claim in the repo
                   # rests on, so an untested path here is a number nobody
                   # checked (#19).
context = 80.0     # measured 83.2
memory = 75.0      # measured 77.9
protocol = 65.0    # measured 68.7
retrieval = 97.0   # measured 100.0 — a small module whose every branch (FTS5
                   # and fallback) is exercised, so the floor stays high
security = 97.0    # measured 99.4 after #32. The package where an untested
                   # path is an unchecked security claim, so it carries the
                   # highest floor in the tree, not the lowest.
config = 95.0      # measured 97.5 — new, small and fully exercised
diagnostics = 85.0 # measured 86.5 — readiness checks, tested against stubs
runtime = 90.0     # measured 95.3 — process lifecycle, tested against a stub
tools = 40.0       # measured 44.2, dragged down by filesystem.py and git.py
                   # having no unit tests yet — see the file floor below.

# A package average hides its riskiest member. shell.py is the bubblewrap
# boundary: `tools` could stay above 40% while it rotted to nothing.
[tool.coverage_gate.files]
"src/harness/tools/shell.py" = 85.0   # measured 90.6
# shellsplit.py decides *which* command the classifier judges, so a gap here
# moves the subject of the decision rather than the decision. Both files sit at
# 100% / 99.7% and there is no reason for either to drop back.
"src/harness/security/shellsplit.py" = 100.0
"src/harness/security/classifier.py" = 97.0   # measured 99.7

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
